name: Security Image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to publish
        default: v0.35.1-p1-distroless
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test
        run: |
          make build
          make test
      - name: Build Linux binaries
        run: |
          for arch in amd64 arm64; do
            mkdir -p ".build/linux-${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 "$(go env GOPATH)/bin/promu" build --prefix .
            cp alertmanager amtool ".build/linux-${arch}/"
          done
      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.distroless \
            -t "ghcr.io/${{ github.repository_owner }}/alertmanager:${{ inputs.image-tag }}" \
            --push .
      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH /user/packages/container/alertmanager -f visibility=public
